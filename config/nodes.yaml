cluster: mini2

# Overlay edges exactly as specified:
#   AB, BC, BD, BE, EF, ED, EG, AH, AG, AI
overlay:
  - [A, B]
  - [B, C]
  - [B, D]
  - [B, E]
  - [E, F]
  - [E, D]
  - [E, G]
  - [A, H]
  - [A, G]
  - [A, I]

# Directed scatter-gather tree used by the code. The overlay above records the
# assignment edges; this section removes ambiguity when an overlay edge would
# otherwise create multiple possible parents.
children:
  A: [B, H, G, I]
  B: [C, D, E]
  E: [F]

roles:
  A: {role: leader}
  B: {role: team}
  C: {role: team}
  D: {role: team}
  E: {role: team}
  F: {role: team}
  G: {role: team}
  H: {role: team}
  I: {role: team, lang: python}

# Two-host deployment.
# Update addr values with the actual IP addresses of your two machines.
# host1: runs the leader (A) and primary team nodes.
# host2: runs the remaining team nodes, including the Python node I.
hosts:
  host1: { addr: 192.168.1.139, procs: [A, B, C, D, E, F] }
  host2: { addr: 192.168.1.118, procs: [G, H, I] }

ports:
  A: 50051
  B: 50052
  C: 50053
  D: 50054
  E: 50055
  F: 50056
  G: 50057
  H: 50058
  I: 50059
