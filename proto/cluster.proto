syntax = "proto3";

package mini2;

message Query {
  string client_id  = 1;
  string request_id = 2;
  int32  chunk_size = 3;
  int32  offset     = 4;
}

message ShardRequest {
  Query query = 1;
}

message Segment {
  bytes payload = 1;
  bool  last    = 2;
}

message ShardReply {
  repeated Segment segments = 1;
}

message AggregatedReply {
  repeated Segment segments   = 1;
  bool             complete   = 2;
  int32            next_offset = 3;
  bool             has_more   = 4;
}

service TeamService {
  rpc Fetch(ShardRequest) returns (ShardReply);
}

service LeaderService {
  rpc QueryOnce(Query) returns (AggregatedReply);
}
